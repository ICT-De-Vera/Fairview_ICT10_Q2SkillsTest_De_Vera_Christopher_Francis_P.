<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Skills Test</title>
</head>
<body>
    <style>
        :root {
            color-scheme: dark;
            --ink: #eaf5ff;
            --muted: #a9c5d8;
            --cyan: #31d9e8;
            --yellow: #ffe15a;
            --panel: rgba(8, 29, 52, 0.88);
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: clamp(24px, 6vw, 72px) 20px;
            color: var(--ink);
            background:
                radial-gradient(circle at 85% 15%, rgba(49, 217, 232, .18), transparent 25%),
                radial-gradient(circle at 12% 90%, rgba(255, 225, 90, .12), transparent 28%),
                #07182b;
            background-image:
                radial-gradient(circle at 85% 15%, rgba(49, 217, 232, .18), transparent 25%),
                radial-gradient(circle at 12% 90%, rgba(255, 225, 90, .12), transparent 28%),
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: auto, auto, 32px 32px, 32px 32px;
        }
        h1 {
            max-width: 720px;
            margin: 0 auto 10px;
            color: var(--yellow);
            font-size: clamp(2rem, 6vw, 3.5rem);
            line-height: 1.05;
            letter-spacing: -.04em;
            text-shadow: 0 3px 0 #8e6e10;
        }
        h1::before {
            content: "SCIENCE LAB / 01";
            display: block;
            margin-bottom: 12px;
            color: var(--cyan);
            font-size: .75rem;
            letter-spacing: .2em;
            text-shadow: none;
        }
        h1 + .card::before {
            content: "Explore the building blocks of everything.";
            display: block;
            margin-bottom: 20px;
            color: var(--muted);
            font-size: 1rem;
        }
        .card {
            max-width: 720px;
            margin: 24px auto 0;
            padding: clamp(20px, 4vw, 32px);
            border: 1px solid rgba(49, 217, 232, .35);
            border-radius: 18px;
            background: var(--panel);
            box-shadow: 0 18px 50px rgba(0, 0, 0, .28), inset 0 1px rgba(255,255,255,.06);
            backdrop-filter: blur(10px);
        }
        .card-body {
            display: flex;
            gap: 12px;
        }
        input {
            min-width: 0;
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #42627a;
            border-radius: 10px;
            outline: none;
            background: #061426;
            color: var(--ink);
            font: inherit;
        }
        input::placeholder {
            color: #7893a8;
        }
        input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(49, 217, 232, .16);
        }
        button {
            padding: 14px 20px;
            border: 0;
            border-radius: 10px;
            background: var(--yellow);
            color: #182334;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 225, 90, .2);
        }
        #output {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 14px 10px;
            color: var(--muted);
        }
        #output strong {
            color: var(--cyan);
        }
        #output span {
            color: var(--ink);
        }
        @media (max-width: 520px) {
            .card-body {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
    <script type="py" src="main.py"></script>
    <h1>Periodic Table Look Up</h1>
    <div class="card">
        <div class="card-body">
            <input type="text" id="elementInput" placeholder="Enter element name or symbol">
            <button onclick="lookupElement()">Look Up</button>
        </div>
    </div>
    <div id="output" class="card">
        <strong>Element:</strong> <span id="elementName"></span><br>
        <strong>Atomic Number:</strong> <span id="atomicNumber"></span><br>
        <strong>Atomic Mass:</strong> <span id="atomicMass"></span><br>
        <strong>Element Symbol:</strong> <span id="elementSymbol"></span><br>
    </div>
</body>
</html>
