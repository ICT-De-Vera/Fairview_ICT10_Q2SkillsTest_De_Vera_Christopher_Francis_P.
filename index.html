<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Skills Test</title>
</head>
<body>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            color: #222;
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 215, 72, .22) 0 7%, transparent 7.5%),
                radial-gradient(circle at 88% 78%, rgba(47, 205, 220, .2) 0 9%, transparent 9.5%),
                linear-gradient(135deg, #123f70, #087e9d 55%, #163b68);
        }
        h1 {
            max-width: 640px;
            margin: 0 auto 20px;
            color: #183b5b;
            font-size: 2rem;
        }
        .card {
            max-width: 640px;
            margin: 24px auto 0;
            padding: 24px;
            border: 2px solid #f4c542;
            border-radius: 14px;
            background: #fff9e8;
            box-shadow: 0 7px 0 rgba(5, 41, 74, .22);
        }
        .card-body {
            display: flex;
            gap: 12px;
        }
        input {
            min-width: 0;
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #b8c4ce;
            border-radius: 5px;
            outline: none;
            background: #fff;
            color: #222;
            font: inherit;
        }
        input::placeholder {
            color: #737d86;
        }
        input:focus {
            border-color: #356b9a;
        }
        button {
            padding: 14px 20px;
            border: 0;
            border-radius: 5px;
            background: #285d87;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #1d496d;
        }
        #output {
            display: grid;
            gap: 12px;
            color: #444;
        }
        .result-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 10px;
        }
        #output strong {
            color: #285d87;
        }
        #output span {
            color: #222;
        }
        @media (max-width: 520px) {
            .card-body {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
    <h1>Periodic Table Look Up</h1>
    <div class="card">
        <div class="card-body">
            <input type="text" id="elementInput" placeholder="Enter element name or symbol">
            <button py-click="lookupElement">Look Up</button>
        </div>
    </div>
    <div id="output" class="card">
        <div class="result-row"><strong>Element:</strong><span id="elementName"></span></div>
        <div class="result-row"><strong>Atomic Number:</strong><span id="atomicNumber"></span></div>
        <div class="result-row"><strong>Atomic Mass:</strong><span id="atomicMass"></span></div>
        <div class="result-row"><strong>Element Symbol:</strong><span id="elementSymbol"></span></div>
    </div>
    <script type="py" src="main.py"></script>
</body>
</html>
